<!DOCTYPE html>
<meta charset="utf-8">
<title>ITM QUANT · banco visual multi-activo</title>

<style>
  body { background:#0b0f17; color:#e6edf7; font:12px ui-monospace,monospace; margin:0; padding:12px; }
  h2 { font-size:12px; letter-spacing:.08em; color:#8494ad; margin:14px 0 6px; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { background:#121826; border:1px solid #243044; border-radius:6px; padding:6px;
          width:360px; box-sizing:border-box; }
  .cell b { display:block; font-size:11px; color:#d9a441; margin-bottom:4px; }
  /* Tamaño EXPLÍCITO: el bucle de render mide el host, y un host sin altura
     calculada produce un lienzo de cero y un panel que dibuja donde no debe. */
  .cv { width:346px; height:170px; position:relative; }
  .cv.tall { height:250px; }
  :root { --pos:#22c55e; --neg:#ef4444; --grid:#243044; --text:#e6edf7;
          --text-dim:#8494ad; --text-mute:#5b6880; --panel-3:#1b2436; --gold:#d9a441; }
</style>
<body>
<div id="out"></div>
<script src="/static/itmq_core.js?v=dev"></script>
<script src="/static/itmq_panels.js?v=dev"></script>
<script>
// Activos de escalas DELIBERADAMENTE incomparables. La corrección sólo vale si
// los cinco se leen igual de bien sin tocar ninguna constante por ticker.
const ASSETS = [
  { sym:'SPY',  px:601.0,  gex:1.4e9,  step:1.0  },   // ETF enorme, cadena densa
  { sym:'QQQ',  px:487.5,  gex:9.0e8,  step:1.0  },   // ETF grande
  { sym:'DIA',  px:534.2,  gex:4.1e8,  step:0.5  },   // ETF mediano, strikes finos
  { sym:'XLF',  px:48.3,   gex:6.0e6,  step:0.5  },   // ETF sectorial barato
  { sym:'SOFI', px:9.52,   gex:2.2e4,  step:0.5  },   // acción pequeña
];

// Perfil realista: cola pesada (unos pocos strikes concentran casi todo).
function profile(a, n){
  const rows=[]; const mid=Math.floor(n/2);
  for(let i=0;i<n;i++){
    const d=i-mid;
    const decay=Math.exp(-Math.abs(d)/4.5);
    const spike=(Math.abs(d)===3||Math.abs(d)===7)?7.5:1;
    const v=a.gex*decay*spike*(d>=0?1:-0.85)*(0.55+Math.random()*0.9);
    rows.push({ label:(a.px+d*a.step).toFixed(a.px<20?1:0), value:v, key:i });
  }
  return rows;
}
// Histograma temporal con la mayoría de barras pequeñas y algún pico enorme.
function lane(a, n){
  const rows=[];
  for(let i=0;i<n;i++){
    const base=a.gex/450*(0.06+Math.random()*0.5);
    const spike=(i===Math.floor(n*0.42))?26:(i%37===0?5:1);
    rows.push({ label:String(i), value:base*spike*(Math.random()>0.42?1:-1), key:i });
  }
  return rows;
}

const out=document.getElementById('out');
function section(title, build, n, tall){
  const h=document.createElement('h2'); h.textContent=title; out.appendChild(h);
  const g=document.createElement('div'); g.className='grid'; out.appendChild(g);
  ASSETS.forEach(a=>{
    const c=document.createElement('div'); c.className='cell';
    const b=document.createElement('b'); b.textContent=`${a.sym}  ${a.px}`; c.appendChild(b);
    const host=document.createElement('div'); host.className='cv'+(tall?' tall':'');
    host.id=`${title.replace(/\W/g,'')}_${a.sym}`;
    c.appendChild(host); g.appendChild(c);
    build(host, a, n);
  });
}

section('EXPOSICION por strike (hbars, 45 strikes)', (host,a,n)=>{
  ITMQPanels.hbars(host,{fmt:v=>ITMQ.signedCompact(v,1)}).set(profile(a,n));
}, 45, true);

section('FLUJO carril inferior (bars, 120 buckets)', (host,a,n)=>{
  ITMQPanels.bars(host,{fmt:v=>ITMQ.compact(v,1)}).set(lane(a,n));
}, 120);

section('FLUJO carril denso (bars, 390 buckets de sesion)', (host,a,n)=>{
  ITMQPanels.bars(host,{fmt:v=>ITMQ.compact(v,1)}).set(lane(a,n));
}, 390);

window.__harnessReady = true;
</script>
