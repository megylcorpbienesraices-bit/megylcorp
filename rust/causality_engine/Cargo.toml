[package]
name = "itm_causality_engine"
version = "1.45.0"
edition = "2021"
license = "Proprietary"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
bincode = "1.3"
zmq = "0.10"
ctrlc = "3"
core_affinity = "0.8"
memmap2 = "0.9"

[dev-dependencies]
proptest = "1"
